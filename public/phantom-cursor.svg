<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <style>
      .phantom-body { fill: #f0f0f0; stroke: #333; stroke-width: 0.8; }
      .phantom-feature { fill: #333; }
    </style>
  </defs>
  <!-- Little phantom character - optimized for cursor use -->
  <g>
    <!-- Body -->
    <ellipse class="phantom-body" cx="24" cy="26" rx="12" ry="14"/>
    <!-- Head -->
    <circle class="phantom-body" cx="24" cy="12" r="9"/>
    <!-- Left eye -->
    <circle class="phantom-feature" cx="19" cy="10" r="2.5"/>
    <!-- Right eye -->
    <circle class="phantom-feature" cx="29" cy="10" r="2.5"/>
    <!-- Mouth/nose -->
    <path d="M 22 14 Q 24 15 26 14" stroke="#333" stroke-width="1" fill="none" stroke-linecap="round"/>
    <!-- Hover indicator - subtle glow -->
    <circle cx="24" cy="26" r="14" fill="none" stroke="#666" stroke-width="0.5" opacity="0.3"/>
  </g>
</svg>
