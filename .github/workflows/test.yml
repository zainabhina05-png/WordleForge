name: Security Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test

      - name: Generate coverage
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
        continue-on-error: true

  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Type check
        run: npm run type-check

  build:
    name: Build Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env for build
        run: |
          cat > .env.local << EOF
          DATABASE_URL=postgresql://user:password@localhost:5432/wordforge_test
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_dummy
          CLERK_SECRET_KEY=sk_test_dummy
          CLERK_WEBHOOK_SECRET=whsec_dummy
          NEXT_PUBLIC_APP_URL=http://localhost:3000
          NODE_ENV=production
          EOF

      - name: Build application
        run: npm run build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for high vulnerabilities
        run: |
          if npm audit | grep -q "high\|critical"; then
            echo "::warning::High or critical vulnerabilities found"
          fi

  results:
    name: Test Results Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, lint-and-type-check, build, security-audit]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Test Suite Results:"
          echo "- Unit Tests: ${{ needs.unit-tests.result }}"
          echo "- Lint & Type Check: ${{ needs.lint-and-type-check.result }}"
          echo "- Build: ${{ needs.build.result }}"
          echo "- Security Audit: ${{ needs.security-audit.result }}"

      - name: Fail if critical tests failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.build.result == 'failure' ||
          needs.lint-and-type-check.result == 'failure'
        run: exit 1
